<div class="page-shell">
  <header class="site-header">
    <a class="brand" routerLink="/">Shello</a>
    <nav class="site-nav">
      <a routerLink="/shop" routerLinkActive="active" i18n>Shop</a>
      <a class="cart-link" routerLink="/cart" routerLinkActive="active" i18n>Cart
        <ng-container *ngIf="cartCount$ | async as count">
          <span class="cart-badge" *ngIf="count > 0">{{ count }}</span>
        </ng-container>
      </a>
      <a routerLink="/orders" routerLinkActive="active" i18n>Orders</a>
    </nav>
    <div class="header-actions" *ngIf="user$ | async as user; else guestActions">
      <div class="user-menu">
        <button
          class="user-button"
          type="button"
          aria-haspopup="true"
          aria-label="Open user menu"
          i18n-aria-label
        >
          <span class="user-initial">{{ user.name.charAt(0) }}</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
        <div class="user-dropdown">
          <div class="user-info">
            <span class="user-name">{{ user.name }} {{ user.lastName }}</span>
            <span class="user-email">{{ user.email }}</span>
          </div>
          <a class="menu-item" routerLink="/profile" i18n>Profile</a>
          <a class="menu-item" routerLink="/orders" i18n>Orders</a>
          <a class="menu-item" *ngIf="user.role === 'admin'" routerLink="/admin" i18n>Admin</a>
          <button class="menu-item" type="button" (click)="logout()" i18n>Sign out</button>
        </div>
      </div>
    </div>
    <ng-template #guestActions>
      <div class="header-actions">
        <a class="btn ghost" routerLink="/login" i18n>Login</a>
        <a class="btn primary" routerLink="/register" i18n>Get Started</a>
      </div>
    </ng-template>
  </header>

  <main class="site-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <div>
      <p class="footer-title" i18n>Shello Studio</p>
      <p class="footer-copy" i18n>Designed for confident protection and bold style.</p>
    </div>
    <div class="footer-links">
      <a routerLink="/" i18n>Shop</a>
      <a routerLink="/cart" i18n>Cart</a>
      <a *ngIf="(user$ | async)?.role === 'admin'" routerLink="/admin" i18n>Admin</a>
    </div>
    <div class="lang-switch drag-switch" role="group" aria-label="Language switcher" i18n-aria-label>
      <div class="drag-track" #dragTrack (pointerdown)="startDrag($event)">
        <span class="drag-label left">KA</span>
        <span class="drag-label right">EN</span>
        <div
          class="drag-thumb"
          #dragThumb
          [style.left]="dragPosition"
          [class.active]="dragging"
        >
          <span>{{ dragLocale === 'ka' ? 'KA' : 'EN' }}</span>
        </div>
      </div>
    </div>
  </footer>
</div>
