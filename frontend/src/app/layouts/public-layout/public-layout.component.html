<div class="page-shell">
  <header class="site-header">
    <div class="header-primary">
      <a class="brand" routerLink="/">Shello</a>
      <button class="menu-toggle btn ghost icon-btn" type="button" (click)="toggleMobileMenu()" aria-label="Open menu" i18n-aria-label>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16" />
          <path d="M4 12h16" />
          <path d="M4 17h16" />
        </svg>
      </button>
    </div>

    <div class="mobile-overlay" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
    <div class="header-content" [class.open]="isMobileMenuOpen" (click)="onMobileSheetBackgroundClick($event)">
      <div class="mobile-sheet-head" (click)="$event.stopPropagation()">
        <p class="mobile-sheet-title" i18n>Menu</p>
        <button class="btn ghost icon-btn" type="button" (click)="closeMobileMenu()" aria-label="Close menu" i18n-aria-label>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12" />
            <path d="M18 6l-12 12" />
          </svg>
        </button>
      </div>

      <section class="mobile-section" (click)="$event.stopPropagation()">
      <nav class="site-nav">
        <a routerLink="/shop" routerLinkActive="active" (click)="closeMobileMenu()" i18n *ngIf="pageToggles?.shop !== false">Shop</a>
        <a class="cart-link" routerLink="/cart" routerLinkActive="active" (click)="closeMobileMenu()" i18n *ngIf="pageToggles?.cart !== false">Cart</a>
        <a routerLink="/orders" routerLinkActive="active" (click)="closeMobileMenu()" i18n *ngIf="pageToggles?.orders !== false">Orders</a>
      </nav>
      </section>

      <section class="mobile-section" (click)="$event.stopPropagation()">
      <div class="header-actions" *ngIf="user$ | async as user; else guestActions">
        <div class="user-menu" #userMenu [class.open]="isUserMenuOpen">
          <button
            class="user-button"
            type="button"
            aria-haspopup="true"
            [attr.aria-expanded]="isUserMenuOpen"
            aria-label="Open user menu"
            i18n-aria-label
            (click)="toggleUserMenu($event)"
          >
            <span class="user-initial">{{ user.name.charAt(0) }}</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
          <div class="user-dropdown">
            <div class="user-info">
              <span class="user-name">{{ user.name }} {{ user.lastName }}</span>
              <span class="user-email">{{ user.email }}</span>
            </div>
            <a class="menu-item" routerLink="/profile" (click)="closeUserMenu(); closeMobileMenu()" i18n>Profile</a>
            <a class="menu-item" routerLink="/orders" (click)="closeUserMenu(); closeMobileMenu()" i18n *ngIf="pageToggles?.orders !== false">Orders</a>
            <a class="menu-item" *ngIf="user.role === 'admin'" routerLink="/admin" (click)="closeUserMenu(); closeMobileMenu()" i18n>Admin</a>
            <button class="menu-item" type="button" (click)="logout()" i18n>Sign out</button>
          </div>
        </div>
      </div>
      <ng-template #guestActions>
        <div class="header-actions">
          <a class="btn ghost" routerLink="/login" (click)="closeMobileMenu()" i18n *ngIf="pageToggles?.login !== false">Login</a>
          <a class="btn primary" routerLink="/register" (click)="closeMobileMenu()" i18n *ngIf="pageToggles?.register !== false">Get Started</a>
        </div>
      </ng-template>
      </section>

      <section class="mobile-section" (click)="$event.stopPropagation()">
      <div class="lang-switch drag-switch" role="group" aria-label="Language switcher" i18n-aria-label>
        <div class="drag-track" #dragTrack (pointerdown)="startDrag($event)">
          <span class="drag-label left">KA</span>
          <span class="drag-label right">EN</span>
          <div
            class="drag-thumb"
            #dragThumb
            [style.left]="dragPosition"
            [class.active]="dragging"
          >
            <span>{{ dragLocale === 'ka' ? 'KA' : 'EN' }}</span>
          </div>
        </div>
      </div>
      </section>
    </div>
  </header>

  <main class="site-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <div>
      <p class="footer-title" i18n>Shello Studio</p>
      <p class="footer-copy" i18n>Designed for confident protection and bold style.</p>
    </div>
    <div class="footer-links">
      <a routerLink="/" i18n>Shop</a>
      <a routerLink="/cart" i18n *ngIf="pageToggles?.cart !== false">Cart</a>
      <a *ngIf="(user$ | async)?.role === 'admin'" routerLink="/admin" i18n>Admin</a>
    </div>
    <div class="lang-switch drag-switch" role="group" aria-label="Language switcher" i18n-aria-label>
      <div class="drag-track" (pointerdown)="startDrag($event)">
        <span class="drag-label left">KA</span>
        <span class="drag-label right">EN</span>
        <div class="drag-thumb" [style.left]="dragPosition" [class.active]="dragging">
          <span>{{ dragLocale === 'ka' ? 'KA' : 'EN' }}</span>
        </div>
      </div>
    </div>
  </footer>
</div>
