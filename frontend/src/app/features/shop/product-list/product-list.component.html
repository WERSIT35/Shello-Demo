<section class="grid">
  <div class="grid-header">
    <h2 i18n>Shop drops</h2>
    <p i18n>Browse the full lineup. Each case is tested, tuned, and limited.</p>
  </div>
  <div class="grid-cards skeleton-grid" *ngIf="isLoading">
    <article class="card skeleton-card" *ngFor="let i of [1,2,3,4,5,6]">
      <div class="card-image skeleton"></div>
      <div class="skeleton skeleton-line title"></div>
      <div class="skeleton skeleton-line meta"></div>
      <div class="skeleton skeleton-line action"></div>
    </article>
  </div>
  <p class="state-text error" *ngIf="!isLoading && errorMessage">{{ errorMessage }}</p>
  <div class="grid-cards" *ngIf="!isLoading">
    <article
      class="card"
      role="link"
      tabindex="0"
      *ngFor="let product of products"
      (click)="goToProduct(product.id)"
      (keydown.enter)="goToProduct(product.id)"
      (keydown.space)="goToProduct(product.id); $event.preventDefault()"
    >
      <a class="card-image" [routerLink]="['/products', product.id]">
        <img *ngIf="getPrimaryImage(product) as image; else imageFallback" [src]="image" alt="" />
        <ng-template #imageFallback>
          <div class="image-fallback">
            <span i18n>No image</span>
          </div>
        </ng-template>
      </a>
      <div class="card-top">
        <span class="card-title">{{ product.title }}</span>
        <span class="card-price">{{ product.price | currency:'GEL':'symbol-narrow':'1.2-2' }}</span>
      </div>
      <div class="card-meta" *ngIf="getMeta(product).length">
        <span class="meta-pill" *ngFor="let tag of getMeta(product)">{{ tag }}</span>
      </div>
      <div class="card-actions">
        <a class="card-link" [routerLink]="['/products', product.id]" i18n>View details</a>
        <button class="btn ghost" type="button" (click)="addToCart(product); $event.stopPropagation()" i18n *ngIf="cartEnabled">Add</button>
      </div>
    </article>
  </div>
  <p class="state-text" *ngIf="!isLoading && !errorMessage && products.length === 0" i18n>No products available.</p>
</section>
