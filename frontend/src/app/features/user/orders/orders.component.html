<section class="orders">
  <div class="orders-header">
    <h1 i18n>Your orders</h1>
    <p i18n>Track every drop with status snapshots.</p>
  </div>
  <p class="state-text" *ngIf="isLoading" i18n>Loading orders...</p>
  <p class="state-text error" *ngIf="!isLoading && errorMessage">{{ errorMessage }}</p>
  <div class="orders-grid">
    <div class="order-card" *ngFor="let order of orders">
      <div>
        <p class="order-id">{{ order.id }}</p>
        <p class="order-status">{{ order.status }}</p>
      </div>
      <span class="order-total">{{ order.totalPrice | currency:'GEL':'symbol-narrow':'1.2-2' }}</span>
    </div>
  </div>
  <p class="state-text" *ngIf="!isLoading && !errorMessage && orders.length === 0" i18n>No orders yet.</p>
</section>
