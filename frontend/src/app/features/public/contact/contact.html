<div class="hero-section">
  <h1 class="hero-title">დაგვიკავშირდით</h1>
  <p class="hero-subtitle">მოხარული ვიქნებით მოვისმინოთ თქვენგან. იქნება ეს შეკითხვა ჩვენს პროდუქტებზე, წინადადება, თუ უბრალოდ მოკითხვა, ჩვენ აქ ვართ დასახმარებლად.</p>
</div>

<div class="glass-effect" style="margin: 2rem auto; padding: 2rem; max-width: 600px;">
  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 1rem;">
      <label for="name" style="display: block; margin-bottom: 0.5rem;">სახელი</label>
      <input type="text" id="name" formControlName="name" style="width: 100%; padding: 0.5rem; border-radius: 0.25rem; border: 1px solid var(--border-color); background-color: rgba(255, 255, 255, 0.1); color: var(--text-color-primary);">
    </div>
    <div style="margin-bottom: 1rem;">
      <label for="email" style="display: block; margin-bottom: 0.5rem;">ელ.ფოსტა</label>
      <input type="email" id="email" formControlName="email" style="width: 100%; padding: 0.5rem; border-radius: 0.25rem; border: 1px solid var(--border-color); background-color: rgba(255, 255, 255, 0.1); color: var(--text-color-primary);">
    </div>
    <div style="margin-bottom: 1rem;">
      <label for="message" style="display: block; margin-bottom: 0.5rem;">შეტყობინება</label>
      <textarea id="message" rows="5" formControlName="message" style="width: 100%; padding: 0.5rem; border-radius: 0.25rem; border: 1px solid var(--border-color); background-color: rgba(255, 255, 255, 0.1); color: var(--text-color-primary);"></textarea>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="!contactForm.valid">შეტყობინების გაგზავნა</button>
  </form>
</div>
