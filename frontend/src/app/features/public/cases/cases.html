<div class="cases-section">
  <h2>Our Collection</h2>
  <div class="cases-grid">
    <div *ngFor="let case of cases" class="case-card">
      <img [src]="case.image" alt="{{ case.name }}" class="case-image">
      <h3 class="case-name">{{ case.name }}</h3>
      <p class="case-material">{{ case.material }}</p>
      <p class="case-price">₾{{ case.price }}</p>
    </div>
    
    <!-- Add a "Coming Soon" card -->
    <div class="case-card">
      <h3 class="case-name">Coming Soon</h3>
      <p class="case-material">New designs are on the way.</p>
    </div>
  </div>
</div>
