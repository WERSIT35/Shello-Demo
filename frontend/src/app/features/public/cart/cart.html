<div class="cart-container">
  <h2>Shopping Cart</h2>
  <div *ngIf="(cartItems$ | async) as cartItems">
    <div *ngIf="cartItems.length > 0; else emptyCart">
      <div *ngFor="let item of cartItems" class="cart-item">
        <img [src]="item.product.imageUrl" alt="{{ item.product.name }}" class="item-image">
        <div class="item-details">
          <h3 class="item-name">{{ item.product.name }}</h3>
          <p class="item-price">{{ item.product.price | currency }}</p>
          <p class="item-quantity">Quantity: {{ item.quantity }}</p>
          <button (click)="removeFromCart(item.product.id)">Remove</button>
        </div>
      </div>
      <div class="cart-total">
        <h3>Total: {{ calculateTotal(cartItems) | currency }}</h3>
        <button (click)="checkout()">Checkout</button>
      </div>
    </div>
    <ng-template #emptyCart>
      <p>Your cart is empty.</p>
    </ng-template>
  </div>
</div>
