<section class="admin-dashboard">
  <h1 i18n>Admin overview</h1>
  <p class="state-text" *ngIf="isLoading" i18n>Loading stats...</p>
  <p class="state-text error" *ngIf="!isLoading && errorMessage">{{ errorMessage }}</p>
  <div class="stats" *ngIf="!isLoading && !errorMessage">
    <div class="stat-card">
      <p i18n>Active products</p>
      <h2>{{ activeProducts }}</h2>
    </div>
    <div class="stat-card">
      <p i18n>Orders today</p>
      <h2>{{ ordersToday }}</h2>
    </div>
    <div class="stat-card">
      <p i18n>Pending shipments</p>
      <h2>{{ pendingShipments }}</h2>
    </div>
  </div>
</section>
