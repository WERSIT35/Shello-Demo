<section class="admin-section">
  <div class="header-row">
    <div>
      <h1 i18n>Content</h1>
      <p class="hint" i18n>Manage hero messaging and suggested cases without touching code.</p>
    </div>
    <button class="btn primary" type="button" (click)="saveContent()" [disabled]="isSaving">
      <span *ngIf="isSaving" i18n>Saving...</span>
      <span *ngIf="!isSaving" i18n>Save changes</span>
    </button>
  </div>

  <p class="state-text" *ngIf="isLoading" i18n>Loading content...</p>
  <p class="state-text error" *ngIf="!isLoading && errorMessage">{{ errorMessage }}</p>
  <p class="state-text success" *ngIf="!isLoading && saveMessage">{{ saveMessage }}</p>

  <div class="content-grid" *ngIf="!isLoading && !errorMessage">
    <div class="panel">
      <div class="panel-head">
        <h2 i18n>Hero</h2>
        <div class="locale-toggle">
          <button
            class="btn ghost"
            type="button"
            [class.active]="heroLocale === 'ka'"
            (click)="setHeroLocale('ka')"
          >
            ქართული
          </button>
          <button
            class="btn ghost"
            type="button"
            [class.active]="heroLocale === 'en'"
            (click)="setHeroLocale('en')"
          >
            English
          </button>
        </div>
      </div>
      <div class="field">
        <label i18n>Title</label>
        <input type="text" [(ngModel)]="heroDraft.title" />
      </div>
      <div class="field">
        <label i18n>Subtitle</label>
        <textarea rows="3" [(ngModel)]="heroDraft.subtitle"></textarea>
      </div>
      <div class="field">
        <label i18n>Primary CTA</label>
        <input type="text" placeholder="Text" i18n-placeholder [(ngModel)]="heroDraft.primaryCtaText" />
        <input type="text" placeholder="Link" i18n-placeholder [(ngModel)]="heroDraft.primaryCtaLink" />
      </div>
      <div class="field">
        <label i18n>Secondary CTA</label>
        <input type="text" placeholder="Text" i18n-placeholder [(ngModel)]="heroDraft.secondaryCtaText" />
        <input type="text" placeholder="Link" i18n-placeholder [(ngModel)]="heroDraft.secondaryCtaLink" />
      </div>
      <div class="field">
        <label i18n>Highlights (one per line)</label>
        <textarea rows="4" [(ngModel)]="highlightsText"></textarea>
      </div>
      <div class="field">
        <label i18n>Categories</label>
        <div class="category-row">
          <input type="text" placeholder="Add category" i18n-placeholder [(ngModel)]="newCategory" />
          <button class="btn ghost" type="button" (click)="addCategory()" i18n>Add</button>
        </div>
        <div class="category-list" *ngIf="categoriesDraft.length">
          <button
            class="category-chip"
            type="button"
            *ngFor="let category of categoriesDraft"
            (click)="removeCategory(category)"
            title="Remove"
            i18n-title
          >
            {{ category }}
            <svg class="icon chip-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6L6 18" />
              <path d="M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label i18n>Hero image</label>
        <div class="hero-preview" *ngIf="heroDraft.imageUrl">
          <img [src]="heroDraft.imageUrl" alt="" />
        </div>
        <label class="file-label">
          <input type="file" accept="image/*" (change)="onHeroImageSelected($event)" />
          <span i18n>Upload image</span>
        </label>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <h2 i18n>Suggested cases</h2>
          <p class="hint" i18n>Pick up to {{ suggestedLimit }} products to show on the homepage.</p>
        </div>
        <span class="pill" *ngIf="suggestedLimit > 0" i18n>
          Selected {{ selectedSuggestedCount }}/{{ suggestedLimit }}
        </span>
      </div>
      <div class="products-grid">
        <button
          class="select-card"
          type="button"
          *ngFor="let product of products"
          [class.active]="isSelected(product.id)"
          (click)="toggleSuggested(product.id)"
        >
          <article class="card">
            <div class="card-image">
              <img *ngIf="product.images.length" [src]="product.images[0]" alt="" />
            </div>
            <div class="card-top">
              <span>{{ product.title }}</span>
              <span class="card-price">
                {{ product.price | currency:'GEL':'symbol-narrow':'1.2-2' }}
              </span>
            </div>
            <div class="card-meta" *ngIf="getMeta(product).length">
              <span class="meta-pill" *ngFor="let tag of getMeta(product)">{{ tag }}</span>
            </div>
          </article>
        </button>
      </div>
    </div>
  </div>
</section>
