<section class="admin-section">
  <h1>Users</h1>
  <div class="create-header-bar">
    <h2>Create user</h2>
    <button class="btn primary" type="button" (click)="showCreate = true">New user</button>
  </div>
  <div class="modal" *ngIf="showCreate">
    <div class="modal-backdrop" (click)="showCreate = false"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h3>New user</h3>
        <button class="btn ghost" type="button" (click)="showCreate = false">Close</button>
      </div>
      <p class="state-text error" *ngIf="createErrorMessage">{{ createErrorMessage }}</p>
      <div class="create-grid">
        <input type="text" placeholder="First name" [(ngModel)]="createDraft.name" />
        <input type="text" placeholder="Last name" [(ngModel)]="createDraft.lastName" />
        <input type="email" placeholder="Email" [(ngModel)]="createDraft.email" />
        <input type="password" placeholder="Temp password" [(ngModel)]="createDraft.password" />
        <input type="text" placeholder="Pin code" maxlength="6" [(ngModel)]="createDraft.pinCode" />
        <select [(ngModel)]="createDraft.role">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
        <label class="status-toggle">
          <input type="checkbox" [(ngModel)]="createDraft.isActive" />
          <span>Enabled</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" type="button" (click)="showCreate = false">Cancel</button>
        <button class="btn primary" type="button" (click)="createUser()" [disabled]="isCreating">
          {{ isCreating ? 'Creating...' : 'Create' }}
        </button>
      </div>
    </div>
  </div>
  <p class="state-text" *ngIf="isLoading">Loading users...</p>
  <p class="state-text error" *ngIf="!isLoading && errorMessage">{{ errorMessage }}</p>
  <div class="table">
    <div class="row header">
      <span>First name</span>
      <span>Last name</span>
      <span>Email</span>
      <span>Pin</span>
      <span>Account</span>
      <span>Role</span>
      <span>Action</span>
    </div>
    <div class="row" *ngFor="let user of users">
      <span *ngIf="editingId !== user.id">{{ user.name }}</span>
      <input *ngIf="editingId === user.id" type="text" [(ngModel)]="draft.name" />
      <span *ngIf="editingId !== user.id">{{ user.lastName }}</span>
      <input *ngIf="editingId === user.id" type="text" [(ngModel)]="draft.lastName" />
      <span *ngIf="editingId !== user.id">{{ user.email }}</span>
      <input *ngIf="editingId === user.id" type="email" [(ngModel)]="draft.email" />
      <span *ngIf="editingId !== user.id">{{ user.pinCode }}</span>
      <input *ngIf="editingId === user.id" type="text" maxlength="6" [(ngModel)]="draft.pinCode" />
      <span *ngIf="editingId !== user.id" class="status-chip">
        <span class="status-dot" [class.offline]="!user.isActive"></span>
        {{ user.isActive ? 'Enabled' : 'Disabled' }}
      </span>
      <label class="status-toggle" *ngIf="editingId === user.id">
        <input type="checkbox" [(ngModel)]="draft.isActive" />
        <span>Enabled</span>
      </label>
      <span *ngIf="editingId !== user.id">{{ user.role }}</span>
      <select *ngIf="editingId === user.id" [(ngModel)]="draft.role">
        <option value="user">user</option>
        <option value="admin">admin</option>
      </select>
      <button
        class="btn ghost icon-btn"
        type="button"
        *ngIf="editingId !== user.id"
        (click)="startEdit(user)"
        [disabled]="updatingIds.has(user.id)"
        aria-label="Edit"
        title="Edit"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
        </svg>
      </button>
      <div class="row-actions" *ngIf="editingId === user.id">
        <button
          class="btn ghost icon-btn"
          type="button"
          (click)="saveEdit(user)"
          [disabled]="updatingIds.has(user.id)"
          aria-label="Save"
          title="Save"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" />
          </svg>
        </button>
        <button
          class="btn ghost icon-btn"
          type="button"
          (click)="cancelEdit()"
          aria-label="Cancel"
          title="Cancel"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6L6 18" />
            <path d="M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="row-actions" *ngIf="editingId !== user.id">
        <button
          class="btn ghost icon-btn"
          type="button"
          (click)="resetPassword(user)"
          [disabled]="updatingIds.has(user.id)"
          aria-label="Reset password"
          title="Reset password"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3.3-6.9" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
        <button
          class="btn ghost danger icon-btn"
          type="button"
          (click)="deleteUser(user)"
          [disabled]="updatingIds.has(user.id)"
          aria-label="Delete"
          title="Delete"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M8 6V4h8v2" />
            <path d="M6 6l1 14h10l1-14" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <p class="state-text" *ngIf="!isLoading && !errorMessage && users.length === 0">
    No users found.
  </p>
</section>
