<section class="admin-section">
  <h1 i18n>Users</h1>
  <div class="create-header-bar">
    <h2 i18n>Create user</h2>
    <button class="btn primary" type="button" (click)="showCreate = true" i18n>New user</button>
  </div>
  <div class="modal" *ngIf="showCreate">
    <div class="modal-backdrop" (click)="showCreate = false"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h3 i18n>New user</h3>
        <button class="btn ghost" type="button" (click)="showCreate = false" i18n>Close</button>
      </div>
      <p class="state-text error" *ngIf="createErrorMessage">{{ createErrorMessage }}</p>
      <div class="create-grid">
        <input type="text" placeholder="First name" i18n-placeholder [(ngModel)]="createDraft.name" />
        <input type="text" placeholder="Last name" i18n-placeholder [(ngModel)]="createDraft.lastName" />
        <input type="email" placeholder="Email" i18n-placeholder [(ngModel)]="createDraft.email" />
        <input type="password" placeholder="Temp password" i18n-placeholder [(ngModel)]="createDraft.password" />
        <input type="text" placeholder="Pin code" i18n-placeholder maxlength="6" [(ngModel)]="createDraft.pinCode" />
        <select [(ngModel)]="createDraft.role">
          <option value="user" i18n>user</option>
          <option value="admin" i18n>admin</option>
        </select>
        <label class="status-toggle">
          <input type="checkbox" [(ngModel)]="createDraft.isActive" />
          <span i18n>Active</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" type="button" (click)="showCreate = false" i18n>Cancel</button>
        <button class="btn primary" type="button" (click)="createUser()" [disabled]="isCreating">
          <span *ngIf="isCreating" i18n>Creating...</span>
          <span *ngIf="!isCreating" i18n>Create</span>
        </button>
      </div>
    </div>
  </div>
  <p class="state-text" *ngIf="isLoading" i18n>Loading users...</p>
  <p class="state-text error" *ngIf="!isLoading && errorMessage">{{ errorMessage }}</p>
  <div class="table">
    <div class="row header">
      <span i18n>Name</span>
      <span i18n>Email</span>
      <span i18n>Pin</span>
      <span i18n>Status</span>
      <span i18n>Role</span>
      <span i18n>Action</span>
    </div>
    <div class="row" *ngFor="let user of users">
      <div *ngIf="editingId !== user.id" class="name-stack">
        <span class="name-main">{{ user.name }} {{ user.lastName }}</span>
        <span class="name-sub" *ngIf="user.role === 'admin'" i18n>Admin account</span>
        <span class="name-sub" *ngIf="user.role !== 'admin'" i18n>Customer account</span>
      </div>
      <div *ngIf="editingId === user.id" class="name-edit">
        <input type="text" placeholder="First name" i18n-placeholder [(ngModel)]="draft.name" />
        <input type="text" placeholder="Last name" i18n-placeholder [(ngModel)]="draft.lastName" />
      </div>
      <span *ngIf="editingId !== user.id">{{ user.email }}</span>
      <input *ngIf="editingId === user.id" type="email" [(ngModel)]="draft.email" />
      <span *ngIf="editingId !== user.id">{{ user.pinCode }}</span>
      <input *ngIf="editingId === user.id" type="text" maxlength="6" [(ngModel)]="draft.pinCode" />
      <span *ngIf="editingId !== user.id" class="status-chip">
        <span class="status-dot" [class.offline]="!user.isActive"></span>
        <span *ngIf="user.isActive" i18n>Active</span>
        <span *ngIf="!user.isActive" i18n>Offline</span>
      </span>
      <label class="status-toggle" *ngIf="editingId === user.id">
        <input type="checkbox" [(ngModel)]="draft.isActive" />
        <span i18n>Active</span>
      </label>
      <span *ngIf="editingId !== user.id">{{ user.role }}</span>
      <select *ngIf="editingId === user.id" [(ngModel)]="draft.role">
        <option value="user" i18n>user</option>
        <option value="admin" i18n>admin</option>
      </select>
      <div class="row-actions" *ngIf="editingId === user.id">
        <button
          class="btn ghost icon-btn"
          type="button"
          (click)="saveEdit(user)"
          [disabled]="updatingIds.has(user.id)"
          aria-label="Save"
          title="Save"
          i18n-aria-label
          i18n-title
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" />
          </svg>
        </button>
        <button
          class="btn ghost icon-btn"
          type="button"
          (click)="cancelEdit()"
          aria-label="Cancel"
          title="Cancel"
          i18n-aria-label
          i18n-title
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12" />
            <path d="M18 6l-12 12" />
          </svg>
        </button>
      </div>
      <div class="row-actions" *ngIf="editingId !== user.id">
        <button
          class="btn ghost icon-btn"
          type="button"
          (click)="startEdit(user)"
          [disabled]="updatingIds.has(user.id)"
          aria-label="Edit"
          title="Edit"
          i18n-aria-label
          i18n-title
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20h4l10-10-4-4L4 16v4z" />
            <path d="M12 6l4 4" />
          </svg>
        </button>
        <button
          class="btn ghost icon-btn danger"
          type="button"
          *ngIf="user.isActive"
          (click)="toggleActive(user)"
          [disabled]="updatingIds.has(user.id)"
          aria-label="Deactivate"
          title="Deactivate"
          i18n-aria-label
          i18n-title
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14" />
          </svg>
        </button>
        <button
          class="btn ghost icon-btn success"
          type="button"
          *ngIf="!user.isActive"
          (click)="toggleActive(user)"
          [disabled]="updatingIds.has(user.id)"
          aria-label="Activate"
          title="Activate"
          i18n-aria-label
          i18n-title
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
        </button>
        <button
          class="btn ghost icon-btn"
          type="button"
          (click)="resetPassword(user)"
          [disabled]="updatingIds.has(user.id)"
          aria-label="Reset password"
          title="Reset password"
          i18n-aria-label
          i18n-title
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
        <button
          class="btn ghost danger icon-btn"
          type="button"
          (click)="deleteUser(user)"
          [disabled]="updatingIds.has(user.id)"
          aria-label="Delete"
          title="Delete"
          i18n-aria-label
          i18n-title
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 7h12" />
            <path d="M9 7V5h6v2" />
            <path d="M8 7l1 12h6l1-12" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <p class="state-text" *ngIf="!isLoading && !errorMessage && users.length === 0" i18n>No users found.</p>
</section>
