name: Secret Hygiene

on:
  push:
    branches:
      - main
      - test
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret patterns check
        run: |
          set -e
          # Scan only _config files_ (env, env.example, markdown) to avoid script logic in bootstrap.sh.
          TARGETS=$(find . -type f \( -name '.env' -o -name '*.env' -o -name '*.env.example' -o -name '*.md' \))
          echo "checking files: $TARGETS"
          for FIELD in SUPER_ADMIN_PASSWORD JWT_SECRET REFRESH_SECRET TWO_FACTOR_ENCRYPTION_KEY GOOGLE_CLIENT_SECRET; do
            for F in $TARGETS; do
              if grep -n -E "${FIELD}=.+$" "$F" | grep -v 'replace-with'; then
                echo "ERROR: ${FIELD} hardcoded value found in file $F";
                exit 1;
              fi
            done
          done

      - name: Run detect-secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install detect-secrets
          if [ -f .secrets-baseline ]; then
            detect-secrets scan --baseline .secrets-baseline
          else
            echo "No baseline found; running detect-secrets without baseline."
            detect-secrets scan
          fi
