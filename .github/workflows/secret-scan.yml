name: Secret Hygiene

on:
  push:
    branches:
      - main
      - test
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret patterns check
        run: |
          set -e
          # Skip local env files and examples (safe placeholder values) while scanning committed content.
          # Only inspect real config files, not script templates or source code.
          # Allowed files include .env, .env.example, and markdown docs.
          FILE_INCLUDES="--include='.env' --include='*.env' --include='*.env.example' --include='*.md'"
          if grep -R --line-number --include='.env' --include='*.env' --include='*.env.example' --include='*.md' -E 'SUPER_ADMIN_PASSWORD=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: SUPER_ADMIN_PASSWORD hardcoded value found in repository files";
            exit 1;
          fi
          if grep -R --line-number --include='.env' --include='*.env' --include='*.env.example' --include='*.md' -E 'JWT_SECRET=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: JWT_SECRET hardcoded value found in repository files";
            exit 1;
          fi
          if grep -R --line-number --include='.env' --include='*.env' --include='*.env.example' --include='*.md' -E 'REFRESH_SECRET=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: REFRESH_SECRET hardcoded value found in repository files";
            exit 1;
          fi
          if grep -R --line-number --include='.env' --include='*.env' --include='*.env.example' --include='*.md' -E 'TWO_FACTOR_ENCRYPTION_KEY=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: TWO_FACTOR_ENCRYPTION_KEY hardcoded value found in repository files";
            exit 1;
          fi
          if grep -R --line-number --include='.env' --include='*.env' --include='*.env.example' --include='*.md' -E 'GOOGLE_CLIENT_SECRET=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: GOOGLE_CLIENT_SECRET hardcoded value found in repository files";
            exit 1;
          fi

      - name: Run detect-secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install detect-secrets
          if [ -f .secrets-baseline ]; then
            detect-secrets scan --baseline .secrets-baseline
          else
            echo "No baseline found; running detect-secrets without baseline."
            detect-secrets scan
          fi
