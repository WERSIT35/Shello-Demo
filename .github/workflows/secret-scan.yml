name: Secret Hygiene

on:
  push:
    branches:
      - main
      - test
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret patterns check
        run: |
          set -e
          # Scan only tracked config files to prevent script files from being scanned.
          TARGETS=$(git ls-files '*.env' '*.env.example' '*.md' || true)
          echo "checking files: $TARGETS"
          for FIELD in SUPER_ADMIN_PASSWORD JWT_SECRET REFRESH_SECRET TWO_FACTOR_ENCRYPTION_KEY GOOGLE_CLIENT_SECRET; do
            if [ -z "$TARGETS" ]; then
              continue
            fi
            git grep -n -E "${FIELD}=.+$" -- $TARGETS || true | grep -v 'replace-with' && {
              echo "ERROR: ${FIELD} hardcoded value found in tracked config files";
              exit 1;
            }
          done

      - name: Run detect-secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install detect-secrets
          if [ -f .secrets-baseline ]; then
            detect-secrets scan --baseline .secrets-baseline
          else
            echo "No baseline found; running detect-secrets without baseline."
            detect-secrets scan
          fi
