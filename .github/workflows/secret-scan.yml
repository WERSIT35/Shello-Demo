name: Secret Hygiene

on:
  push:
    branches:
      - main
      - test
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret patterns check
        run: |
          set -e
          # Only treat strong production secrets as fails; allow placeholder tokens in .env.example
          grep -R --line-number --exclude-dir=.git --exclude='*example*' --exclude='*.md' -E 'SUPER_ADMIN_PASSWORD=.+$' . || true
          if grep -R --line-number --exclude-dir=.git --exclude='*example*' --exclude='*.md' -E 'SUPER_ADMIN_PASSWORD=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: SUPER_ADMIN_PASSWORD hardcoded value found in repository files";
            exit 1;
          fi
          if grep -R --line-number --exclude-dir=.git --exclude='*example*' --exclude='*.md' -E 'JWT_SECRET=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: JWT_SECRET hardcoded value found in repository files";
            exit 1;
          fi
          if grep -R --line-number --exclude-dir=.git --exclude='*example*' --exclude='*.md' -E 'REFRESH_SECRET=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: REFRESH_SECRET hardcoded value found in repository files";
            exit 1;
          fi
          if grep -R --line-number --exclude-dir=.git --exclude='*example*' --exclude='*.md' -E 'TWO_FACTOR_ENCRYPTION_KEY=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: TWO_FACTOR_ENCRYPTION_KEY hardcoded value found in repository files";
            exit 1;
          fi
          if grep -R --line-number --exclude-dir=.git --exclude='*example*' --exclude='*.md' -E 'GOOGLE_CLIENT_SECRET=.+$' . | grep -v 'replace-with'; then
            echo "ERROR: GOOGLE_CLIENT_SECRET hardcoded value found in repository files";
            exit 1;
          fi

      - name: Run detect-secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install detect-secrets
          if [ -f .secrets-baseline ]; then
            detect-secrets scan --baseline .secrets-baseline
          else
            echo "No baseline found; running detect-secrets without baseline."
            detect-secrets scan
          fi
