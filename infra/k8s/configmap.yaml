  PORT: "4000"
  FRONTEND_URL: "https://shellotech.eu.org,https://shellotech.eu.org/en"
  BCRYPT_ROUNDS: "12"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"
  TRUST_PROXY: "1"
