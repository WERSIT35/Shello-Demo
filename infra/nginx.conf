upstream shello_backend {
  server backend:4000 resolve;
}

upstream shello_frontend_ka {
  server frontend_ka:4200 resolve;
}

upstream shello_frontend_en {
  server frontend_en:4201 resolve;
}

server {
  listen 80;
  server_name shellotech.eu.org _;
  client_max_body_size 20m;
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 2s;

  location /api/ {
    proxy_pass http://shello_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://shello_backend/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /en {
    return 301 /en/;
  }

  location /en/ {
    proxy_pass http://shello_frontend_en;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ka {
    return 301 /;
  }

  location /ka/ {
    return 301 /;
  }

  location / {
    proxy_pass http://shello_frontend_ka;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
