version: "3.8"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./Backend/server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
    depends_on:
      - mongo

  frontend_ka:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4200
      LOCALE: ka
    depends_on:
      - backend

  frontend_en:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4201
      LOCALE: en
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend_ka
      - frontend_en
      - backend

volumes:
  mongo-data:
